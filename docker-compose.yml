services:
  my-little-booklist:
    image: ghcr.io/molshape/mylittlebooklist:latest
    build: .
    container_name: my-little-booklist
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - my-little-booklist-data:/data
    restart: unless-stopped

volumes:
  my-little-booklist-data:
