{% extends "base.html" %}
{% block title %}{{ _("Log in") }} · {% endblock %}
{% block content %}
<article class="narrow">
  <h2>{{ _("Log in") }}</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ _("Username") }} <input name="username" autocomplete="username" required autofocus></label>
    <label>{{ _("Password") }} <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">{{ _("Log in") }}</button>
  </form>
</article>
{% endblock %}
