[project]
name = "mylittlebooklist"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "gunicorn>=26.2.0",
    "isbnlib>=3.10.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff defaults plus import sorting
select = ["E4", "E7", "E9", "F", "I"]

[[tool.mypy.overrides]]
# These libraries ship no type information
module = ["isbnlib", "flask_babel"]
ignore_missing_imports = true

[tool.mypy]
strict = true
