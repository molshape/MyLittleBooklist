[project]
name = "mylittlebooklist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "gunicorn>=26.2.0",
    "isbnlib>=3.10.14",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff defaults plus import sorting
select = ["E4", "E7", "E9", "F", "I"]
